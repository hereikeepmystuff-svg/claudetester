# rsync exclude patterns applied to every tracked directory (one per line).
# See "INCLUDE/EXCLUDE PATTERN RULES" in rsync(1).

# Version control metadata of nested repos
.git/

# Caches, state and logs
cache/
Cache/
CachedData/
*.log
*.tmp
*.swp
*~

# Plugin managers re-download these
nvim/lazy-lock.json.bak
plugged/

# Secrets — never back these up
.ssh/
.gnupg/
*.pem
*.key
id_rsa*
id_ed25519*
