# Tracked config files and the packages they need.
#
# Format:  <path>   [package ...]
#   - <path> is relative to $HOME (a leading ~/ is fine) or absolute for system
#     files such as /etc/pacman.conf (restored with sudo). No spaces in paths.
#   - Packages are installed by install.sh. Repo packages and AUR packages are
#     detected automatically; prefix a name with aur: to force the AUR.
#   - Lines starting with # are comments. Paths missing on this machine are
#     skipped with a warning, so it is safe to keep entries for other machines.
#
# Add entries by hand or with:  ./dotfiles.sh add ~/.config/foo foo-package

# Shell
.bashrc                                  bash bash-completion
.bash_profile
.zshrc                                   zsh zsh-autosuggestions zsh-syntax-highlighting
.config/starship.toml                    starship

# Git
.gitconfig                               git

# Editors
.config/nvim                             neovim ripgrep fd tree-sitter-cli
.vimrc                                   vim

# Terminal
.config/alacritty                        alacritty
.config/kitty                            kitty
.tmux.conf                               tmux

# Desktop (Hyprland / Wayland)
.config/hypr                             hyprland hyprpaper hyprlock hypridle xdg-desktop-portal-hyprland
.config/waybar                           waybar otf-font-awesome
.config/wofi                             wofi
.config/mako                             mako

# Tools
.config/btop                             btop
.config/fastfetch                        fastfetch

# System files (restored with sudo)
/etc/pacman.conf                         pacman-contrib
/etc/makepkg.conf
